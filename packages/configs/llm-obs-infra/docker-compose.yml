x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "3"

services:
  llmobs-traefik:
    image: traefik:v3.7
    container_name: llmobs-traefik-gateway
    restart: unless-stopped
    logging: *default-logging
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=llmobs-network"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--accesslog=true"
      - "--accesslog.format=json"
      - "--accesslog.fields.headers.defaultmode=keep"
      - "--metrics.prometheus=true"
      - "--tracing.otlp=true"
      - "--tracing.otlp.grpc.endpoint=llmobs-otel-collector:4317"
      - "--tracing.otlp.grpc.insecure=true"
    ports:
      - "${PORT_TRAEFIK_HTTP:-31410}:80"
      - "${PORT_TRAEFIK_DASHBOARD:-31411}:8080"
      - "${PORT_TRAEFIK_HTTPS:-31419}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/traefik/dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro
      - ./config/certs:/etc/traefik/certs:ro
    environment:
      - DOCKER_API_VERSION=1.40
      - OTEL_SERVICE_NAME=llmobs-traefik-gateway
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://llmobs-otel-collector:4318
    networks:
      - llmobs-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`llmobs.gateway`) || Host(`gateway.llmobs.local`)"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.middlewares=security-headers@file,rate-limit@file"

  llmobs-redis:
    image: redis:7-alpine
    container_name: llmobs-redis-ledger
    restart: unless-stopped
    logging: *default-logging
    command: >
      redis-server /etc/redis/redis.conf
      --requirepass ${REDIS_PASSWORD:-llmobs_redis_s3cret_2024}
    ports:
      - "${PORT_REDIS:-31413}:6379"
    environment:
      - OTEL_SERVICE_NAME=llmobs-redis-ledger
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://llmobs-otel-collector:4318
    volumes:
      - ./config/redis/redis.conf:/etc/redis/redis.conf:ro
    networks:
      - llmobs-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-llmobs_redis_s3cret_2024} ping | grep PONG"]
      interval: 3s
      timeout: 3s
      retries: 5

  llmobs-kafka:
    image: apache/kafka:latest
    container_name: llmobs-kafka-broker
    restart: unless-stopped
    logging: *default-logging
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 512M
    ports:
      - "${PORT_KAFKA:-31414}:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,EXTERNAL://:31414,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://llmobs-kafka-broker:9092,EXTERNAL://localhost:31414
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_NUM_PARTITIONS=3
      - KAFKA_JVM_PERFORMANCE_OPTS=-Xms512m -Xmx1024m
      - OTEL_SERVICE_NAME=llmobs-kafka-broker
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://llmobs-otel-collector:4318
    volumes:
      - ./config/kafka/server.properties:/etc/kafka/server.properties:ro
      - kafka_data:/var/lib/kafka/data
    networks:
      - llmobs-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9092 || exit 0"]
      interval: 5s
      timeout: 3s
      retries: 5

  llmobs-clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: llmobs-clickhouse-analytics
    restart: unless-stopped
    logging: *default-logging
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    deploy:
      resources:
        limits:
          memory: 4096M
        reservations:
          memory: 1024M
    ports:
      - "${PORT_CLICKHOUSE_HTTP:-31421}:8123"
      - "${PORT_CLICKHOUSE_NATIVE:-31422}:9000"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-llm_telemetry_analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-llmobs_clickhouse_s3cret_2026}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      OTEL_SERVICE_NAME: llmobs-clickhouse-analytics
      OTEL_EXPORTER_OTLP_ENDPOINT: http://llmobs-otel-collector:4318
    volumes:
      - ./config/clickhouse/config.d:/etc/clickhouse-server/config.d:ro
      - ./config/clickhouse/users.d:/etc/clickhouse-server/users.d
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - llmobs-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  llmobs-tempo:
    image: grafana/tempo:latest
    container_name: llmobs-tempo-tracing
    restart: unless-stopped
    logging: *default-logging
    command: ["-config.file=/etc/tempo/tempo-config.yaml"]
    environment:
      - OTEL_SERVICE_NAME=llmobs-tempo-tracing
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://llmobs-otel-collector:4318
    volumes:
      - ./config/tempo/tempo-config.yaml:/etc/tempo/tempo-config.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "${PORT_TEMPO:-31416}:3200"
      - "${PORT_TEMPO_OTLP_GRPC:-31423}:4317"
    networks:
      - llmobs-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tempo.rule=Host(`llmobs.tempo`) || Host(`tempo.llmobs.local`)"
      - "traefik.http.routers.tempo.entrypoints=websecure"
      - "traefik.http.routers.tempo.tls=true"
      - "traefik.http.routers.tempo.middlewares=security-headers@file,rate-limit@file"
      - "traefik.http.services.tempo.loadbalancer.server.port=3200"

  llmobs-otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: llmobs-otel-collector
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 256M
    command: ["--config=/etc/otel-collector-config.yaml"]
    environment:
      - OTEL_SERVICE_NAME=llmobs-otel-collector
    volumes:
      - ./config/otel-collector/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "${PORT_OTEL_HTTP:-31417}:4318"
      - "${PORT_OTEL_GRPC:-31418}:4317"
    networks:
      - llmobs-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.otel.rule=Host(`llmobs.otel`) || Host(`otel.llmobs.local`)"
      - "traefik.http.routers.otel.entrypoints=websecure"
      - "traefik.http.routers.otel.tls=true"
      - "traefik.http.routers.otel.middlewares=security-headers@file,rate-limit-ingest@file,payload-limit@file"
      - "traefik.http.services.otel.loadbalancer.server.port=4318"
    depends_on:
      - llmobs-tempo

  llmobs-grafana:
    image: grafana/grafana:latest
    container_name: llmobs-grafana-portal
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${PORT_GRAFANA:-31415}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=${GF_USERS_ALLOW_SIGN_UP:-false}
      - GF_AUTH_ANONYMOUS_ENABLED=${GF_AUTH_ANONYMOUS_ENABLED:-false}
      - GF_USERS_ALLOW_ORG_CREATE=${GF_USERS_ALLOW_ORG_CREATE:-false}
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_SECURITY_STRICT_TRANSPORT_SECURITY=true
      - GF_SECURITY_X_CONTENT_TYPE_OPTIONS=true
      - GF_SECURITY_X_XSS_PROTECTION=true
      - GF_TRACING_OPENTELEMETRY_OTLP_ADDRESS=llmobs-otel-collector:4317
      - GF_TRACING_OPENTELEMETRY_OTLP_PROPAGATION_FORMAT=w3c
      - OTEL_SERVICE_NAME=llmobs-grafana-portal
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://llmobs-otel-collector:4318
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - llmobs-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`llmobs.grafana`) || Host(`grafana.llmobs.local`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.routers.grafana.middlewares=security-headers@file,rate-limit@file"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    depends_on:
      - llmobs-tempo
      - llmobs-otel-collector

  llmobs-alloydb:
    image: google/alloydbomni:15
    container_name: llmobs-alloydb-db
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 512M
    ports:
      - "${PORT_ALLOYDB:-31420}:5432"
    environment:
      - POSTGRES_USER=${ALLOYDB_USER:-admin}
      - POSTGRES_PASSWORD=${ALLOYDB_PASSWORD:-password}
      - POSTGRES_DB=${ALLOYDB_DB:-llm_observability}
      - ALLOYDB_USER=${ALLOYDB_USER:-admin}
      - ALLOYDB_PASSWORD=${ALLOYDB_PASSWORD:-password}
      - ALLOYDB_DB=${ALLOYDB_DB:-llm_observability}
      - OTEL_SERVICE_NAME=llmobs-alloydb-db
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://llmobs-otel-collector:4318
    volumes:
      - alloydb_data:/var/lib/postgresql/data
    networks:
      - llmobs-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${ALLOYDB_USER:-admin} -d ${ALLOYDB_DB:-llm_observability} || pg_isready -U ${ALLOYDB_USER:-admin} -d ${ALLOYDB_DB:-llm_observability} || exit 0"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  llmobs-temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: llmobs-temporal-engine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${PORT_TEMPORAL_GRPC:-31424}:7233"
      - "${PORT_TEMPORAL_UI:-31425}:8080"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${ALLOYDB_USER:-admin}
      - POSTGRES_PWD=${ALLOYDB_PASSWORD:-password}
      - POSTGRES_SEEDS=llmobs-alloydb
      - TEMPORAL_TELEMETRY_TRACING_OTLP_ENDPOINT=llmobs-otel-collector:4317
      - OTEL_SERVICE_NAME=llmobs-temporal-engine
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://llmobs-otel-collector:4318
    volumes:
      - ./config/temporal/temporal.yaml:/etc/temporal/config/temporal.yaml:ro
    depends_on:
      llmobs-alloydb:
        condition: service_started
      llmobs-otel-collector:
        condition: service_started
    networks:
      - llmobs-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 7233 || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  llmobs-network:
    name: llmobs-network
    external: true

volumes:
  tempo_data:
  grafana_data:
  alloydb_data:
  clickhouse_data:
  kafka_data:
