global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'llmobs-platform'
    environment: 'production'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'traefik'
    static_configs:
      - targets: ['llmobs-traefik:8080']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['llmobs-otel-collector:8888']

  - job_name: 'grafana'
    static_configs:
      - targets: ['llmobs-grafana:3000']

  - job_name: 'clickhouse'
    static_configs:
      - targets: ['llmobs-clickhouse:8123']

  - job_name: 'alert-engine'
    static_configs:
      - targets: ['alert-engine:9464']
