apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://llmobs-prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    type: loki
    access: proxy
    url: http://llmobs-loki:3100
    editable: false

  - name: Tempo
    type: tempo
    access: proxy
    url: http://llmobs-tempo:3200
    editable: false
    jsonData:
      httpMethod: GET
      tracesToLogsV2:
        datasourceUid: 'Loki'
        spanStartTimeShift: '1h'
        spanEndTimeShift: '1h'
        filterByTraceID: true
        filterBySpanID: true
      nodeGraph:
        enabled: true

  - name: ClickHouse
    type: vertamedia-clickhouse-datasource
    access: proxy
    url: http://llmobs-clickhouse:8123
    editable: false
    jsonData:
      addExtraHeaders: false
      usePOST: true
      defaultDatabase: llm_telemetry_analytics
