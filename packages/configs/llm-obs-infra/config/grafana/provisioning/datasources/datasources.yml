apiVersion: 1

datasources:
  - name: Tempo
    type: tempo
    access: proxy
    url: http://llmobs-tempo:3200
    isDefault: true
    editable: false
    jsonData:
      httpMethod: GET
      nodeGraph:
        enabled: true

  - name: ClickHouse
    type: vertamedia-clickhouse-datasource
    access: proxy
    url: http://llmobs-clickhouse:8123
    editable: false
    jsonData:
      addExtraHeaders: false
      usePOST: true
      defaultDatabase: llm_telemetry_analytics
