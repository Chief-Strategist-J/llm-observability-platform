apiVersion: 1

datasources:
  - name: Tempo
    type: tempo
    access: proxy
    url: http://llmobs-tempo:3200
    isDefault: true
    editable: true
    jsonData:
      httpMethod: GET
      nodeGraph:
        enabled: true

  - name: ClickHouse
    type: grafana-clickhouse-datasource
    access: proxy
    url: llmobs-clickhouse:9000
    isDefault: false
    editable: true
    jsonData:
      port: 9000
      server: llmobs-clickhouse
      username: default
      defaultDatabase: llm_telemetry_analytics
    secureJsonData:
      password: llmobs_clickhouse_s3cret_2026

  - name: AlloyDB
    type: postgres
    access: proxy
    url: llmobs-alloydb:5432
    user: admin
    database: llm_observability
    isDefault: false
    editable: true
    jsonData:
      sslmode: disable
      postgresVersion: 1500
    secureJsonData:
      password: llmobs_s3cret_2026

  - name: Redis
    type: redis-datasource
    access: proxy
    url: redis://llmobs-redis:6379
    isDefault: false
    editable: true
    secureJsonData:
      password: llmobs_redis_s3cret_2024
