# Cloudflare Tunnel Ingress Override for llm-obs-infra Stack
# Usage: docker compose -f docker-compose.yml -f docker-compose.cloudflare.yml up -d llmobs-cloudflare-tunnel

services:
  llmobs-cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: llmobs-cloudflare-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - llmobs-network
    depends_on:
      - llmobs-traefik
