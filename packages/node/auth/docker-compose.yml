services:
  traefik:
    image: traefik:v2.10
    container_name: auth-traefik-proxy
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "8088:80"
      - "8089:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: observability-auth-service
    ports:
      - "3001:3001"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=PathPrefix(`/api/v1/auth`)"
      - "traefik.http.routers.auth.entrypoints=web"
      - "traefik.http.services.auth.loadbalancer.server.port=3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - USE_REAL_DB=true
      - DATABASE_URL=postgresql://postgres:postgres@alloydb-omni:5432/observability_auth
      - ALLOYDB_OMNI_HOST=alloydb-omni
      - ALLOYDB_OMNI_PORT=5432
      - ALLOYDB_OMNI_USER=postgres
      - ALLOYDB_OMNI_PASSWORD=postgres
      - ALLOYDB_OMNI_DB=observability_auth
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=dev-secret-key-change-in-production
    depends_on:
      alloydb-omni:
        condition: service_healthy
      redis:
        condition: service_healthy

  alloydb-omni:
    image: google/alloydbomni:latest
    container_name: auth-alloydb-omni
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=observability_auth
    volumes:
      - alloydb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d observability_auth"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: auth-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  alloydb_data:
