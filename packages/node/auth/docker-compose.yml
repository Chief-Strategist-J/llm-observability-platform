services:
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: observability-auth-service
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3001
      - USE_REAL_DB=true
      - DATABASE_URL=postgresql://postgres:postgres@auth-db:5432/observability_auth
      - REDIS_URL=redis://localhost:31413
      - KAFKA_BROKERS=localhost:31414
      - JWT_SECRET=dev-secret-key-change-in-production
    depends_on:
      auth-db:
        condition: service_healthy

  auth-db:
    image: google/alloydbomni:latest
    container_name: auth-service-db
    ports:
      - "31412:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=observability_auth
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d observability_auth"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  auth_db_data:
