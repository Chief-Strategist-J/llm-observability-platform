openapi: 3.0.3
info:
  title: Observability Auth Service API
  description: Multi-tenant authentication, RBAC authorization, organization management, audit logging, 3-tier API key permissions, user blocking/soft-deletion, and 13-pillar security hardening contract with standardized API response envelopes (status, message, data, error).
  version: 1.0.0
paths:
  /api/v1/auth/sign-up:
    post:
      summary: Register new user and unique organization
      parameters:
        - in: header
          name: X-CSRF-Token
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: User and organization successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '400':
          description: Validation failure or non-unique organization name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'
        '409':
          description: User email or organization name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'

  /api/v1/auth/sign-in:
    post:
      summary: User sign in with IP and client audit logging metadata
      parameters:
        - in: header
          name: X-Forwarded-For
          required: false
          schema:
            type: string
        - in: header
          name: User-Agent
          required: false
          schema:
            type: string
        - in: header
          name: X-CSRF-Token
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Successful authentication with audit log recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '401':
          description: Invalid credentials or user blocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'
        '429':
          description: Account locked due to brute-force threshold exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'

  /api/v1/auth/session:
    get:
      summary: Verify session token and return user context
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Active session payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '401':
          description: Unauthorized or token expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'

  /api/v1/auth/organizations:
    post:
      summary: Create a new multi-tenant organization
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Organization created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '409':
          description: Organization name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'

  /api/v1/auth/organizations/{id}:
    delete:
      summary: Soft delete organization and cascade delete all related user details, API keys, and logs with timestamp. Retained for 30 days before permanent deletion.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Organization and related entity details soft-deleted with timestamp recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'

  /api/v1/auth/users:
    post:
      summary: Create new user belonging to a specific organization with specific permissions
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created in target organization with specific permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '400':
          description: Validation error or invalid org_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'

  /api/v1/auth/users/{id}/block:
    post:
      summary: Block user access and record blocking timestamp
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User blocked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'

  /api/v1/auth/users/{id}:
    delete:
      summary: Soft delete user record with timestamp (30-day backup retention)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User soft-deleted with timestamp recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'

  /api/v1/auth/forgot-password:
    post:
      summary: Request password reset token via email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Password reset request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'

  /api/v1/auth/reset-password:
    post:
      summary: Reset user password using token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'

  /api/v1/auth/change-password:
    post:
      summary: Change password for authenticated user
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password successfully changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'

  /api/v1/auth/api-keys:
    post:
      summary: Generate 3-tier API key bound to specific permission table
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
      responses:
        '201':
          description: API key generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'

  /api/v1/auth/api-keys/verify:
    post:
      summary: Verify API key validity and evaluate permission table entitlement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyApiKeyRequest'
      responses:
        '200':
          description: API key verified with permission evaluation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'

  /api/v1/auth/permissions:
    get:
      summary: List all system permission definitions and scopes
      responses:
        '200':
          description: Available system permissions table
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'

  /api/v1/auth/audit-logs:
    get:
      summary: Fetch sign-in audit logs for security oversight
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Audit log records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    StandardApiResponse:
      type: object
      required: [status, message, data, error]
      properties:
        status:
          type: string
          enum: [success, error]
        message:
          type: string
        data:
          type: object
          nullable: true
        error:
          $ref: '#/components/schemas/ErrorDetail'
          nullable: true

    StandardApiErrorResponse:
      type: object
      required: [status, message, data, error]
      properties:
        status:
          type: string
          enum: [error]
        message:
          type: string
        data:
          type: null
        error:
          $ref: '#/components/schemas/ErrorDetail'

    ErrorDetail:
      type: object
      required: [code, details]
      properties:
        code:
          type: string
        details:
          type: string

    CreateOrganizationRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
        slug:
          type: string

    CreateUserRequest:
      type: object
      required: [email, password, name, org_id, role, permissions]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
        name:
          type: string
        org_id:
          type: string
        role:
          type: string
          enum: [admin, member, viewer]
        permissions:
          type: array
          items:
            type: string

    SignUpRequest:
      type: object
      required: [email, password, name, organization_name]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 12
        name:
          type: string
          minLength: 2
        organization_name:
          type: string
          minLength: 2
        role:
          type: string
          enum: [admin, member, viewer]
          default: admin

    SignInRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    ResetPasswordRequest:
      type: object
      required: [token, new_password]
      properties:
        token:
          type: string
        new_password:
          type: string
          minLength: 12

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 12

    CreateApiKeyRequest:
      type: object
      required: [name, org_id, key_type, permissions]
      properties:
        name:
          type: string
        org_id:
          type: string
        key_type:
          type: string
          enum: [general, testing, super_secret]
          default: general
        permissions:
          type: array
          items:
            type: string

    VerifyApiKeyRequest:
      type: object
      required: [key]
      properties:
        key:
          type: string
        required_permission:
          type: string
