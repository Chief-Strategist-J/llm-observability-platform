[project]
name = "instrumentation-sdk"
version = "1.8.3"

description = "LLM Observability Instrumentation SDK"
readme = "README.md"
authors = [
    { name = "LLM Observability Team" }
]
dependencies = [
    "python-shared",
    "tiktoken>=0.5.0",
    "kafka-python-ng>=2.2.0",
    "protobuf>=4.25.0",
    "opentelemetry-exporter-otlp>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-exporter-prometheus>=0.45b0",
    "allure-pytest>=2.13.0",
    "pytest-html>=4.0.0",
    "watchdog>=4.0.0",
]

[project.scripts]
llm-observe = "api.cli.controller:main"


[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../python-shared/src"]
addopts = [
    "-v",
    "--tb=short",
    "--alluredir=reports/allure-results",
]
markers = [
    "performance: marks tests as load/performance tests (deselect with '-m not performance')",
]

[tool.setuptools.packages.find]
where = ["src"]
[tool.pyright]
extraPaths = ["src", "../python-shared/src"]
