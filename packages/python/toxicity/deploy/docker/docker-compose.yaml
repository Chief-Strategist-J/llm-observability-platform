version: "3.9"

services:
  toxicity-worker:
    build:
      context: ../..
      dockerfile: build/Dockerfile
    container_name: toxicity-worker
    ports:
      - "8008:8008"
    environment:
      - TOXICITY_MODEL_ID=unitary/toxic-bert
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-llmobs-kafka:9092}
      - KAFKA_CONSUMER_GROUP=toxicity-worker-group
      - KAFKA_TOPIC_INPUT=llm.spans.sampled
      - KAFKA_TOPIC_ALERTS=llm.toxicity.flagged
      - REDIS_URL=${REDIS_URL:-redis://:llmobs_redis_s3cret_2024@llmobs-redis:6379/0}
      - ALLOYDB_HOST=${ALLOYDB_HOST:-alloydb}
      - ALLOYDB_PORT=${ALLOYDB_PORT:-5432}
      - ALLOYDB_USER=${ALLOYDB_USER:-postgres}
      - ALLOYDB_PASSWORD=${ALLOYDB_PASSWORD:-postgres}
      - ALLOYDB_DB=${ALLOYDB_DB:-toxicity_worker_db}
    depends_on:
      alloydb:
        condition: service_healthy
    networks:
      - llmobs-network

  alloydb:
    image: google/alloydbomni:15
    container_name: toxicity-worker-alloydb
    environment:
      ALLOYDB_USER: postgres
      ALLOYDB_PASSWORD: postgres
      ALLOYDB_DB: toxicity_worker_db
    ports:
      - "${PORT_TOXICITY_WORKER_ALLOYDB:-31437}:5432"
    networks:
      - llmobs-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d toxicity_worker_db"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  llmobs-network:
    external: true
