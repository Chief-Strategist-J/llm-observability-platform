version: "3.9"

services:
  quality-engine:
    build:
      context: ../..
      dockerfile: build/Dockerfile
    container_name: quality-engine
    ports:
      - "8010:8080"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-llmobs-kafka:9092}
      - KAFKA_CONSUMER_GROUP=quality-engine-group
      - KAFKA_TOPIC_INPUT=llm.spans.sampled
      - KAFKA_TOPIC_SCORES=llm.quality.scores
      - KAFKA_TOPIC_TOXICITY=llm.toxicity.flagged
      - KAFKA_TOPIC_ALERTS=alerts.quality.degradation
      - ALLOYDB_HOST=${ALLOYDB_HOST:-alloydb}
      - ALLOYDB_PORT=${ALLOYDB_PORT:-5432}
      - ALLOYDB_USER=${ALLOYDB_USER:-postgres}
      - ALLOYDB_PASSWORD=${ALLOYDB_PASSWORD:-postgres}
      - ALLOYDB_DB=${ALLOYDB_DB:-quality_engine_db}
      - REDIS_URL=${REDIS_URL:-redis://:llmobs_redis_s3cret_2024@llmobs-redis:6379/0}
      - TEMPORAL_HOST=${TEMPORAL_HOST:-temporal:7233}
      - TEMPORAL_NAMESPACE=default
      - TEMPORAL_TASK_QUEUE=quality-engine-tasks
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://llmobs-otel-collector:4318}
    depends_on:
      alloydb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - llmobs-network

  alloydb:
    image: google/alloydb-omni:latest
    container_name: quality-engine-alloydb
    environment:
      ALLOYDB_USER: postgres
      ALLOYDB_PASSWORD: postgres
      ALLOYDB_DB: quality_engine_db
    ports:
      - "${PORT_QUALITY_ALLOYDB:-31428}:5432"
    networks:
      - llmobs-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quality_engine_db"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  llmobs-network:
    external: true
