[project]
name = "quality-engine"
version = "0.3.0"
description = "LLM Observability Quality Engine — Kafka consumer, Temporal scheduled-workflow worker & quality baseline scheduler"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-shared",
    "opentelemetry-exporter-otlp-proto-grpc>=1.26.0",
    "temporalio>=1.5.0",
    "langdetect>=1.0.9",
    "clickhouse-connect>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
    "httpx>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "contract: OpenAPI/Event contract tests",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
