version: "3.9"

services:
  latency-engine:
    build:
      context: ../../
      dockerfile: build/Dockerfile
    container_name: latency-engine
    ports:
      - "8002:8002"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-llmobs-kafka:9092}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-latency-engine-cg}
      KAFKA_TOPIC_INPUT: ${KAFKA_TOPIC_INPUT:-llm.spans.raw}
      REDIS_URL: ${REDIS_URL:-redis://:llmobs_redis_s3cret_2024@llmobs-redis:6379/0}
      SLO_CONFIG_PATH: src/slo_config.yaml
      HEALTH_PORT: 8002
    networks:
      - llmobs-network

networks:
  llmobs-network:
    external: true
