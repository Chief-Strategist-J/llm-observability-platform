[project]
name = "event-cost"
version = "0.2.0"
description = "LLM API cost ledger, pricing engine, and Kafka consumer worker for cost aggregation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-shared"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "../python-shared/src", "../instrumentation-sdk/src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
event_cost = ["prices/*.yaml"]
[tool.pyright]
extraPaths = ["src", "../python-shared/src", "../instrumentation-sdk/src"]
