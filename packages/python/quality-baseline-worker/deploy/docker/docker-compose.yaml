version: '3.8'

services:
  quality-worker:
    build:
      context: ../..
      dockerfile: build/Dockerfile
    container_name: quality-baseline-worker
    ports:
      - "8080:8000"
    environment:
      - ALLOYDB_HOST=${ALLOYDB_HOST:-alloydb}
      - ALLOYDB_PORT=${ALLOYDB_PORT:-5432}
      - ALLOYDB_USER=${ALLOYDB_USER:-postgres}
      - ALLOYDB_PASSWORD=${ALLOYDB_PASSWORD:-postgres}
      - ALLOYDB_DB=${ALLOYDB_DB:-quality_baseline_db}
      - ALLOYDB_DSN=${ALLOYDB_DSN:-postgresql://postgres:postgres@alloydb:5432/quality_baseline_db}
      - CLICKHOUSE_HOST=${CLICKHOUSE_HOST:-llmobs-clickhouse}
      - CLICKHOUSE_PORT=${CLICKHOUSE_PORT:-8123}
      - CLICKHOUSE_USERNAME=${CLICKHOUSE_USERNAME:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-}
      - CLICKHOUSE_DATABASE=${CLICKHOUSE_DATABASE:-default}
      - REDIS_URL=${REDIS_URL:-redis://:llmobs_redis_s3cret_2024@llmobs-redis:6379/0}
      - TEMPORAL_HOST=${TEMPORAL_HOST:-temporal:7233}
      - TEMPORAL_NAMESPACE=${TEMPORAL_NAMESPACE:-default}
      - TEMPORAL_TASK_QUEUE=${TEMPORAL_TASK_QUEUE:-quality-baseline-tasks}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-llmobs-kafka:9092}
    depends_on:
      alloydb:
        condition: service_healthy
    networks:
      - llmobs-network

  alloydb:
    image: google/alloydbomni:15
    container_name: quality-baseline-alloydb
    environment:
      ALLOYDB_USER: postgres
      ALLOYDB_PASSWORD: postgres
      ALLOYDB_DB: quality_baseline_db
    ports:
      - "${PORT_QUALITY_BASELINE_ALLOYDB:-31430}:5432"
    networks:
      - llmobs-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quality_baseline_db"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  llmobs-network:
    external: true
