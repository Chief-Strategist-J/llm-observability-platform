version: "3.9"

services:
  semantic-coherence:
    build:
      context: ../..
      dockerfile: build/Dockerfile
    image: chiefj/semantic-coherence:latest
    container_name: semantic-coherence
    ports:
      - "8005:8005"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-llmobs-kafka:9092}
      - REDIS_URL=${REDIS_URL:-redis://:llmobs_redis_s3cret_2024@llmobs-redis:6379/0}
      - ALLOYDB_HOST=${ALLOYDB_HOST:-alloydb}
      - ALLOYDB_PORT=${ALLOYDB_PORT:-5432}
      - ALLOYDB_USER=${ALLOYDB_USER:-postgres}
      - ALLOYDB_PASSWORD=${ALLOYDB_PASSWORD:-postgres}
      - ALLOYDB_DB=${ALLOYDB_DB:-semantic_coherence_db}
      - POSTGRES_HOST=${POSTGRES_HOST:-alloydb}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-semantic_coherence_db}
      - EMBEDDING_WORKER_URL=${EMBEDDING_WORKER_URL:-http://queue-embedding-worker:8080}
      - PRIMARY_SCORER=minilm
      - SCORERS=minilm
      - SCORER_MINILM_MODEL_ID=sentence-transformers/all-MiniLM-L6-v2
    depends_on:
      alloydb:
        condition: service_healthy
    networks:
      - llmobs-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  alloydb:
    image: google/alloydbomni:15
    container_name: semantic-coherence-alloydb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: semantic_coherence_db
    ports:
      - "${PORT_SEMANTIC_ALLOYDB:-31434}:5432"
    networks:
      - llmobs-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d semantic_coherence_db"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  llmobs-network:
    external: true
