version: "3.9"

services:
  budget-provisioner:
    build:
      context: ../../
      dockerfile: build/Dockerfile
    container_name: budget-provisioner
    environment:
      ALLOYDB_DSN: ${ALLOYDB_DSN:-postgresql://postgres:postgres@alloydb:5432/budget_db}
      POSTGRES_DSN: ${POSTGRES_DSN:-postgresql://postgres:postgres@alloydb:5432/budget_db}
      REDIS_URL: ${REDIS_URL:-redis://:llmobs_redis_s3cret_2024@llmobs-redis:6379/0}
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET:-super-secret-key-value-for-testing-1234}
      HOST: 0.0.0.0
      PORT: 8001
    ports:
      - "8001:8001"
    depends_on:
      alloydb:
        condition: service_healthy
    networks:
      - llmobs-network

  alloydb:
    image: google/alloydb-omni:latest
    container_name: budget-provisioner-alloydb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: budget_db
    ports:
      - "${PORT_BUDGET_ALLOYDB:-31423}:5432"
    networks:
      - llmobs-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d budget_db"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  llmobs-network:
    external: true
