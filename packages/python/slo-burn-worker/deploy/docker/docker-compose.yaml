version: '3.8'

services:
  slo-worker:
    build:
      context: ../..
      dockerfile: build/Dockerfile
    container_name: slo-burn-worker-instance
    ports:
      - "8000:8000"
    environment:
      - CLICKHOUSE_HOST=${CLICKHOUSE_HOST:-llmobs-clickhouse}
      - CLICKHOUSE_PORT=${CLICKHOUSE_PORT:-8123}
      - CLICKHOUSE_USERNAME=${CLICKHOUSE_USERNAME:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-}
      - CLICKHOUSE_DATABASE=${CLICKHOUSE_DATABASE:-default}
      - REDIS_URL=${REDIS_URL:-redis://:llmobs_redis_s3cret_2024@llmobs-redis:6379/0}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-llmobs-kafka:9092}
      - ALLOYDB_HOST=${ALLOYDB_HOST:-alloydb}
      - ALLOYDB_PORT=${ALLOYDB_PORT:-5432}
      - ALLOYDB_USER=${ALLOYDB_USER:-postgres}
      - ALLOYDB_PASSWORD=${ALLOYDB_PASSWORD:-postgres}
      - ALLOYDB_DB=${ALLOYDB_DB:-slo_db}
      - POSTGRES_HOST=${POSTGRES_HOST:-alloydb}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-slo_db}
      - TEMPORAL_HOST=${TEMPORAL_HOST:-temporal:7233}
      - TEMPORAL_NAMESPACE=${TEMPORAL_NAMESPACE:-default}
      - TEMPORAL_TASK_QUEUE=${TEMPORAL_TASK_QUEUE:-slo-burn-tasks}
    depends_on:
      alloydb:
        condition: service_healthy
    networks:
      - llmobs-network

  alloydb:
    image: google/alloydbomni:15
    container_name: slo-alloydb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: slo_db
    ports:
      - "${PORT_SLO_ALLOYDB:-31427}:5432"
    networks:
      - llmobs-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d slo_db"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  llmobs-network:
    external: true
