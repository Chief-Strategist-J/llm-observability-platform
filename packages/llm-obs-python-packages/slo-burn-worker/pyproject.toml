[project]
name = "slo-burn-worker"
version = "0.1.0"
description = "Temporal scheduled workflow worker for SLO burn rate computation and alerting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-shared",
    "temporalio>=1.5.0",
    "clickhouse-connect>=0.7.0",
    "ddsketch>=2.0.0",
    "protobuf>=4.21.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
    "httpx>=0.24.0"
]

[tool.pytest.ini_options]
pythonpath = ["src", "../python-shared/src", "../instrumentation-sdk/src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
[tool.pyright]
extraPaths = ["src", "../python-shared/src", "../instrumentation-sdk/src"]
