[project]
name = "queue-embedding-worker"
version = "0.1.0"
description = "Cloudflare Queue worker for span enrichment"
requires-python = ">=3.11"
dependencies = [
    "python-shared"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src", "../python-shared/src", "../instrumentation-sdk/src"]
testpaths = ["tests"]
[tool.pyright]
extraPaths = ["src", "../python-shared/src", "../instrumentation-sdk/src"]
