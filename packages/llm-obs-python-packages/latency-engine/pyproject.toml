[project]
name = "latency-engine"
version = "0.2.0"
description = "LLM Observability Latency Engine — Kafka consumer, DDSketch SLO tracking & Temporal baseline scheduler"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-shared",
    "ddsketch>=2.0.0",
    "protobuf>=4.0.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.26.0",
    "clickhouse-connect>=0.7.0",
    "temporalio>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
    "httpx>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "../python-shared/src", "../instrumentation-sdk/src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
[tool.pyright]
extraPaths = ["src", "../python-shared/src", "../instrumentation-sdk/src"]
