workers:
  - name: quality-engine
    type: event
    language: python
    topics:
      - llm.spans.sampled
    consumer_group: quality-engine-group
    owner: "@llm-observability-platform-team"
    stage: 2
    handlers:
      - SpanQualityHandler
    produces:
      - llm.quality.scores
      - llm.toxicity.flagged
      - alerts.quality.degradation

  - name: quality-baseline-scheduler
    type: temporal
    language: python
    task_queue: quality-baseline-tasks
    owner: "@llm-observability-platform-team"
    stage: 2
    workflows:
      - RecomputeQualityBaseline
      - RollupQualityTrend
      - QualityScoreWorkflow
    activities:
      - recompute_baseline_scores
      - write_redis_baselines
      - rollup_quality_trend
      - detect_language
      - detect_prompt_type
      - compute_coherence
      - compute_toxicity
      - compute_faithfulness
      - compute_perplexity
      - aggregate_composite
