[project]
name = "python-shared"
version = "0.1.0"
description = "Centralized infrastructure, telemetry, db, http, discovery, and shared types for Python microservices"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "opentelemetry-api>=1.26.0",
    "opentelemetry-sdk>=1.26.0",
    "redis>=5.0.0",
    "psycopg[binary]>=3.1.0",
    "httpx>=0.27.0",
    "prometheus-client>=0.17.0",
    "pyyaml>=6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
[tool.pyright]
extraPaths = ["src"]
