openapi: "3.0.3"
info:
  title: Toxicity Service API
  version: "2.0.0"
  description: |
    Unified toxicity service — ONNX inference + Kafka flagging + dual-pass long-text handling.
    Accepts raw text. Trace context may be passed in the request body or via W3C traceparent header.

paths:
  /healthz:
    get:
      summary: Health check
      operationId: healthz_get
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
    post:
      summary: Health check POST
      operationId: healthz_post
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /score:
    post:
      summary: Score a given text for toxicity
      operationId: score
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScoreRequest"
      responses:
        "200":
          description: Toxicity scores + flagging result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoreResponse"
        "422":
          description: Validation error

components:
  schemas:
    HealthResponse:
      type: object
      required: [status, model_id]
      properties:
        status:
          type: string
          example: ok
        model_id:
          type: string
          example: unitary/toxic-bert

    ScoreRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
        trace_id:
          type: string
          nullable: true
          description: Upstream trace ID (hex). Also accepted via W3C traceparent header.
        span_id:
          type: string
          nullable: true
          description: Upstream span ID (hex). Also accepted via W3C traceparent header.

    ScoreResponse:
      type: object
      required: [toxicity, severe_toxicity, obscene, threat, insult, identity_hate, flagged, skipped]
      properties:
        toxicity:
          type: number
          minimum: 0.0
          maximum: 1.0
        severe_toxicity:
          type: number
        obscene:
          type: number
        threat:
          type: number
        insult:
          type: number
        identity_hate:
          type: number
        long_response_strategy:
          type: string
          enum: [max_of_two_passes]
          nullable: true
        score:
          type: number
          nullable: true
          description: Primary toxicity score (same as toxicity field).
        flagged:
          type: boolean
          description: True when score exceeds threshold (0.50) and publisher is wired.
        flag:
          type: string
          nullable: true
          example: TOXIC_RESPONSE
        skipped:
          type: boolean
          description: True when the scoring pipeline failed gracefully.
        skip_reason:
          type: string
          nullable: true
          example: pipeline_failure
