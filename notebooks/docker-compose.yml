version: '3.8'

services:

  jupyter:
    image: chiefj/toxicity-worker:stable
    ports:
      - "8888:8888"
    environment:
      - TOXICITY_MODEL_ID=unitary/toxic-bert
      - PYTHONPATH=/app/packages/python/toxicity-worker/src
    volumes:
      - ../:/app
    working_dir: /app/notebooks
    entrypoint: >
      bash -c "
      pip install --no-cache-dir jupyterlab matplotlib pandas &&
      exec jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token='' --NotebookApp.password=''
      "
    restart: unless-stopped

  latex:
    image: blang/latex:latest
    volumes:
      - ../:/workdir
    working_dir: /workdir/notebooks/runbooks/refs/05-dependency-discovery-and-log-mining
    # Two passes: first builds aux/toc, second resolves cross-references
    command: >
      bash -c "
        pdflatex -interaction=nonstopmode query-access-log-mining.tex &&
        pdflatex -interaction=nonstopmode query-access-log-mining.tex &&
        echo '✅ PDF compiled: query-access-log-mining.pdf'
      "

